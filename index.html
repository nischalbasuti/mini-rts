<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini-RTS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="gameContainer">
      <h1>Mini-RTS</h1>

      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <div id="bottomBar">
        <div id="resourcePanel">
          <div id="resourceDisplay">
            <span id="woodCount">Wood: 0</span>
            <span id="goldCount">Gold: 0</span>
          </div>
          <div id="productionQueue"></div>
        </div>
        <div id="buttonGroup">
          <button id="createVillager">Create Villager (10 wood, 5 gold)</button>
          <button id="createInf">Create Inf (20 wood, 10 gold)</button>
          <button id="createArch">Create Arch</button>
        </div>
        <div id="selectionDetails"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>

  <style>
    /* Basic reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
    }

    #gameContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100vw;
      height: 100vh;
    }

    h1 {
      color: #fff;
      margin-bottom: 10px;
    }

    #gameCanvas {
      border: 1px solid white;
      margin: 10px;
      background-color: #222;
      background: grey;
    }

    #bottomBar {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-top: 10px;
    }

    #resourcePanel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 260px;
    }

    #resourceDisplay {
      display: flex;
      gap: 16px;
      font-family: monospace;
      font-size: 16px;
      color: #ccc;
      align-items: center;
      padding: 10px 16px;
      background-color: #222;
      border: 1px solid #444;
    }

    #resourceDisplay #woodCount {
      color: #8b6;
    }

    #resourceDisplay #goldCount {
      color: #fd0;
    }

    #productionQueue {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 88px;
      padding: 10px 12px;
      background-color: #1b1b1b;
      border: 1px solid #444;
      font-family: monospace;
      font-size: 13px;
      color: #ccc;
    }

    .productionQueueTitle {
      color: #fff;
      font-weight: bold;
    }

    .productionQueueEmpty {
      color: #777;
    }

    .productionQueueItem {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 13px;
      text-align: left;
      border: 1px solid #555;
      background-color: #2b2b2b;
    }

    .productionQueueItem:hover {
      background-color: #3a3a3a;
    }

    .productionQueueDuration {
      color: #fd0;
    }

    .productionQueueState {
      color: #999;
    }

    #buttonGroup {
      display: flex;
      gap: 10px;
    }

    #selectionDetails {
      font-family: monospace;
      font-size: 14px;
      color: #ccc;
      line-height: 1.4;
      min-width: 180px;
      height: 140px;
      overflow: hidden;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #333;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</html>
